<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d0f;color:#eee;font:16px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 12px 140px}
h1{font-style:italic;letter-spacing:3px;margin:16px 0 2px;font-size:30px}h1 span{color:#ff2d2d}.sub{color:#888;font-size:13px;margin-bottom:14px}
.card{background:#18181c;border:1px solid #2a2a30;border-left:4px solid #ff2d2d;border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin:6px 0 3px}
input,select{width:100%;font-size:18px;padding:12px;background:#0d0d0f;color:#fff;border:1px solid #333;border-radius:8px;min-height:48px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tog{display:flex;align-items:center;gap:10px;min-height:48px;font-size:16px}
.tog input{width:26px;height:26px;min-height:0}
button{font-size:17px;font-weight:700;border:0;border-radius:10px;min-height:52px;padding:0 16px;cursor:pointer}
.add{width:100%;background:#26262c;color:#fff;border:1px dashed #555}.rm{background:#3a1515;color:#ff6b6b;min-height:40px;font-size:14px;float:right}
.line{font-size:14px;color:#ccc;display:flex;justify-content:space-between;padding:3px 0}.note{color:#ffb020;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#000d;backdrop-filter:blur(8px);border-top:2px solid #ff2d2d;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.tot{flex:1;font-size:32px;font-weight:900;font-style:italic}.tot small{display:block;font-size:11px;color:#888;font-style:normal;letter-spacing:2px}
.copy{background:#ff2d2d;color:#fff}details summary{cursor:pointer;font-weight:700;min-height:40px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.sec{background:#26262c;color:#fff;border:1px solid #444}

<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"></head><body>
<h1>VINYL<span>WORKS</span></h1><div class="sub">Forged Design graphique · Montréal · Quote calculator (CAD, no tax)</div>
<div class="card"><b>CUSTOMER</b><label>Customer name</label><input id="c_name" placeholder="Name" autocomplete="off"><label>Contact (optional)</label><input id="c_contact" placeholder="Phone or email" autocomplete="off"></div>
<div id="lines"></div>
<button class="add" onclick="addLine()">+ Add decal</button>
<div class="card" style="margin-top:12px"><b>INSTALLATION</b>
<div class="tog"><input type="checkbox" id="inst_all" onchange="upd()"> Install all decals ($10 per 10" billed)</div>
<div class="row" style="grid-template-columns:2fr 1fr"><div><label>Installation time (h)</label><input type="number" id="t_install" min="0" step="0.25" value="0" inputmode="decimal"></div><div><label>$/h</label><input type="number" id="r_install" min="0" step="1" value="30" inputmode="decimal"></div></div>
</div>
<div class="card" style="margin-top:12px"><b>TIME</b>
<div class="row" style="grid-template-columns:2fr 1fr"><div><label>Design time (h)</label><input type="number" id="t_design" min="0" step="0.25" value="0" inputmode="decimal"></div><div><label>$/h</label><input type="number" id="r_design" min="0" step="1" value="30" inputmode="decimal"></div></div>
<div class="row" style="grid-template-columns:2fr 1fr"><div><label>Prep time (h)</label><input type="number" id="t_prep" min="0" step="0.25" value="0" inputmode="decimal"></div><div><label>$/h</label><input type="number" id="r_prep" min="0" step="1" value="30" inputmode="decimal"></div></div>
</div>
<div class="card"><b>Breakdown</b><div id="bd"></div></div>
<div class="card" id="colcard" style="display:none"><b>VINYL BY COLOUR</b><div id="col"></div></div>
<div class="card" id="qacts"><b>QUOTE</b><div class="acts"><button class="sec" onclick="saveQuote()">💾 Save quote</button><button class="sec" onclick="shareQuote()">🔗 Share link</button><button class="sec" onclick="pdfQuote()">📄 PDF</button><button class="sec" onclick="newQuote()">＋ New</button></div>
<details style="margin-top:8px"><summary>Saved quotes (<span id="scount">0</span>)</summary><div id="saved"></div></details></div>
<div class="card"><details><summary>🔒 Material & profit</summary><div id="prof"></div></details></div>
<div class="bar"><div class="tot"><small>TOTAL</small><span id="total">$0</span></div><button class="copy" onclick="copyQuote()">Copy quote</button></div>
<script>
/*CALC-START*/
const VINYL={"matte black":{t:"std",c:4.36/36},"matte white":{t:"std",c:4.36/36},"gloss black":{t:"std",c:4.36/36},"gloss white":{t:"std",c:4.36/36},"reflective white":{t:"refl",c:27.23/36},"reflective black":{t:"refl",c:33.58/36},"yellow 021":{t:"std",c:4.91/36},"king blue 049":{t:"std",c:4.25/36},"silver grey 090":{t:"std",c:4.25/36},"red 032":{t:"std",c:4.91/36}};
function billable(w,h){const L=Math.max(+w||0,+h||0);return L<=0?0:Math.ceil(L/10-1e-9)*10;}
function calcLine(d){const q=Math.max(0,Math.floor(+d.qty||0)),L=billable(d.w,d.h),v=VINYL[d.vinyl];const u=L/10;
 const vinyl=u*(v.t==="refl"?30:20)*q,install=d.install?u*10*q:0;const hrs=L>=100?1.5:L>=50?1:0,labour=hrs*30*q;
 const longest=Math.max(+d.w||0,+d.h||0);const material=L?(longest+8)*v.c*q:0;
 return {L,q,vinyl,install,labour,hrs,material,total:vinyl+install+labour,confirm:L>=100};}
const TIME_KEYS=[["install","Installation time"],["design","Design time"],["prep","Prep time"]];
function calcQuote(lines,time){time=time||{};const r=lines.map(calcLine);const times=TIME_KEYS.map(([k,n])=>{const t=time[k]||{},h=Math.max(0,+t.h||0),rate=t.rate==null||t.rate===""?30:Math.max(0,+t.rate||0);return {key:k,name:n,h,rate,cost:h*rate};});
 const design=times.reduce((s,x)=>s+x.cost,0);
 const total=r.reduce((s,x)=>s+x.total,0)+design,mat=byColour(lines),material=mat.total;
 const vinylSub=r.reduce((s,x)=>s+x.vinyl,0),labourSub=r.reduce((s,x)=>s+x.install+x.labour,0)+design;
 return {times,mat,lines:r,design,vinylSub,labourSub,total,material,profit:total-material};}
const SQFT={"matte black":4.36/6,"matte white":4.36/6,"gloss black":4.36/6,"gloss white":4.36/6,"reflective white":27.23/6,"reflective black":33.58/6,"yellow 021":4.91/6,"king blue 049":4.25/6,"silver grey 090":4.25/6,"red 032":4.91/6};
const TAPE=222.59/100/6;
function byColour(lines){const o={};lines.forEach(d=>{const w=+d.w||0,h=+d.h||0,q=Math.max(0,Math.floor(+d.qty||0));if(!(w>0&&h>0&&q))return;o[d.vinyl]=(o[d.vinyl]||0)+(w+10)*(h+10)*q/144;});
 const rows=Object.keys(o).map(k=>({colour:k,sqft:o[k],rate:SQFT[k],cost:o[k]*SQFT[k]}));const sqft=rows.reduce((s,x)=>s+x.sqft,0),cost=rows.reduce((s,x)=>s+x.cost,0),tape=sqft*TAPE;
 return {rows,sqft,cost,tape,total:cost+tape};}
if(typeof module!=="undefined")module.exports={byColour,billable,calcLine,calcQuote};
/*CALC-END*/
if(typeof document!=="undefined"){
let L=[];const $=id=>document.getElementById(id),m=n=>"$"+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,"");
window.addLine=()=>{L.push({w:"",h:"",qty:1,vinyl:"gloss black",install:false});draw();};
window.rmLine=i=>{L.splice(i,1);draw();};
function draw(){$("lines").innerHTML=L.map((d,i)=>`<div class="card">${L.length>1?`<button class="rm" onclick="rmLine(${i})">Remove</button>`:""}<b>Decal ${i+1}</b>
<div class="row"><div><label>Width"</label><input inputmode="decimal" type="number" value="${d.w}" oninput="L_(${i},'w',this.value)"></div>
<div><label>Height"</label><input inputmode="decimal" type="number" value="${d.h}" oninput="L_(${i},'h',this.value)"></div>
<div><label>Qty</label><input inputmode="numeric" type="number" min="1" value="${d.qty}" oninput="L_(${i},'qty',this.value)"></div></div>
<label>Vinyl</label><select onchange="L_(${i},'vinyl',this.value)">${Object.keys(VINYL).map(k=>`<option ${k===d.vinyl?"selected":""}>${k}</option>`).join("")}</select></div>`).join("");upd();}
window.L_=(i,k,v)=>{L[i][k]=v;upd();};
TIME_KEYS.forEach(([k])=>{const v=localStorage.getItem("vw_rate_"+k);if(v!==null)$("r_"+k).value=v;$("r_"+k).oninput=e=>{localStorage.setItem("vw_rate_"+k,e.target.value);upd();};$("t_"+k).oninput=upd;});
function q(){const t={};TIME_KEYS.forEach(([k])=>t[k]={h:$("t_"+k).value,rate:$("r_"+k).value});const ia=$("inst_all").checked;return calcQuote(L.map(d=>({...d,install:ia})),t);}
function parts(r){const V=[],B=[];r.lines.forEach((x,i)=>{if(!x.L)return;const d=L[i],n=`Decal ${i+1} (${x.q}× ${d.w||0}"×${d.h||0}" ${d.vinyl}, ${x.L}" billed)`;
 V.push([n,x.vinyl]);if(x.install)B.push([`Installation (size) – decal ${i+1}`,x.install]);if(x.labour)B.push([`Labour ${x.hrs} h – decal ${i+1}`+(x.q>1?` ×${x.q}`:""),x.labour]);});
 r.times.forEach(x=>{if(x.cost>0)B.push([`${x.name} (${x.h} h × ${m(x.rate)}/h)`,x.cost]);});return {V,B};}
function upd(){const r=q(),{V,B}=parts(r),row=(a,b)=>`<div class="line"><span>${a}</span><span>${m(b)}</span></div>`;let h="";
 if(V.length){h+=`<div class="line" style="color:#ff2d2d"><b>VINYL</b></div>`+V.map(x=>row(...x)).join("")+`<div class="line"><b>Vinyl subtotal</b><b>${m(r.vinylSub)}</b></div>`;
 h+=`<div class="line" style="color:#ff2d2d;margin-top:8px"><b>LABOUR</b></div>`+(B.length?B.map(x=>row(...x)).join(""):'<div class="line"><span>Included</span><span>$0</span></div>')+`<div class="line"><b>Labour subtotal</b><b>${m(r.labourSub)}</b></div>`;
 if(r.lines.some(x=>x.confirm))h+=`<div class="note">⚠ above 100": confirm price</div>`;
 h+=`<div class="line" style="margin-top:8px;font-size:18px"><b>TOTAL</b><b>${m(r.total)}</b></div>`;}
 $("bd").innerHTML=h||'<div class="line">Enter a size to start</div>';$("total").textContent=m(r.total);
 $("prof").innerHTML=`<div class="line" style="color:#ff2d2d"><b>VINYL BY COLOUR</b> <span style="color:#888">(+5" all sides)</span></div>`+colHtml()+`<div class="line" style="margin-top:8px"><span>Quote total</span><span>${m(r.total)}</span></div><div class="line"><b>Profit</b><b>${m(r.profit)}</b></div>`;
 const c=byColour(L);$("colcard").style.display=c.rows.length>1?"":"none";$("col").innerHTML=colHtml();}
function colHtml(){const c=byColour(L);if(!c.rows.length)return '<div class="line">No vinyl yet</div>';
 return c.rows.map(x=>`<div class="line"><span>${x.colour}: ${x.sqft.toFixed(2)} sq ft (padded) × $${x.rate.toFixed(2)}/sq ft</span><span>$${x.cost.toFixed(2)}</span></div>`).join("")+`<div class="line"><span>Application tape (AT65): ${c.sqft.toFixed(2)} sq ft × $${TAPE.toFixed(3)}/sq ft</span><span>$${c.tape.toFixed(2)}</span></div><div class="line"><b>Total material</b><b>$${c.total.toFixed(2)}</b></div>`;}
window.copyQuote=()=>{const r=q(),{V,B}=parts(r);let t="FORGED GRAPHIC DESIGN – Quote\n\nVINYL\n"+V.map(x=>`• ${x[0]}: ${m(x[1])}`).join("\n")+`\nVinyl subtotal: ${m(r.vinylSub)}\n\nLABOUR\n`+(B.length?B.map(x=>`• ${x[0]}: ${m(x[1])}`).join("\n"):"• Included: $0")+`\nLabour subtotal: ${m(r.labourSub)}\n\nTOTAL: ${m(r.total)} CAD\n\nHow would you like to pay, e-transfer or cash? Please send your full name and email or address.`;
 const done=()=>alert("Quote copied ✅");
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fb(t));else fb(t);
 function fb(s){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();done();}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function state(){const t={};TIME_KEYS.forEach(([k])=>t[k]={h:$("t_"+k).value,rate:$("r_"+k).value});return {v:1,c:{n:$("c_name").value,ct:$("c_contact").value},l:L.map(d=>({w:d.w,h:d.h,qty:d.qty,vinyl:d.vinyl})),ia:$("inst_all").checked,t};}
function load(s){if(!s||!Array.isArray(s.l))return false;L=s.l.map(d=>({w:d.w||"",h:d.h||"",qty:d.qty||1,vinyl:VINYL[d.vinyl]?d.vinyl:"gloss black",install:false}));if(!L.length)L.push({w:"",h:"",qty:1,vinyl:"gloss black",install:false});
 $("c_name").value=(s.c&&s.c.n)||"";$("c_contact").value=(s.c&&s.c.ct)||"";$("inst_all").checked=!!s.ia;TIME_KEYS.forEach(([k])=>{const x=(s.t||{})[k]||{};$("t_"+k).value=x.h||0;if(x.rate!=null&&x.rate!=="")$("r_"+k).value=x.rate;});draw();return true;}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))));};
const SK="vw_saved_quotes",getS=()=>{try{return JSON.parse(localStorage.getItem(SK))||[]}catch(e){return []}},putS=a=>localStorage.setItem(SK,JSON.stringify(a));
const fdate=ts=>new Date(ts).toLocaleDateString("en-CA",{year:"numeric",month:"short",day:"numeric"});
let curId=null;
window.saveQuote=()=>{const a=getS(),s=state(),tot=q().total,now=Date.now();const i=a.findIndex(x=>x.id===curId);
 if(i>=0){a[i]={...a[i],s,total:tot,date:now,no:a[i].no||nextNo()};}else{const no=curNo||nextNo();curId="q"+now;a.unshift({id:curId,no,s,total:tot,date:now});}putS(a);drawSaved();alert("Quote saved ✅");};
window.openQuote=id=>{const x=getS().find(x=>x.id===id);if(x&&load(x.s)){curId=id;curNo=null;scrollTo(0,0);}};
window.delQuote=id=>{const x=getS().find(x=>x.id===id);if(!x||!confirm(`Delete quote for ${x.s.c.n||"(no name)"}?`))return;putS(getS().filter(y=>y.id!==id));if(curId===id)curId=null;drawSaved();};
window.newQuote=()=>{if(!confirm("Start a new blank quote? (unsaved changes are lost)"))return;curId=null;curNo=null;load({l:[],c:{},ia:false,t:{}});history.replaceState(null,"",location.pathname);};
function drawSaved(){const a=getS();$("scount").textContent=a.length;$("saved").innerHTML=a.length?a.map(x=>`<div class="sq"><div class="i"><b>${esc(x.s.c.n||"(no name)")}</b> · ${m(x.total)}<small>${x.no?x.no+" · ":""}${fdate(x.date)}${x.s.c.ct?" · "+esc(x.s.c.ct):""}</small></div><button class="op" onclick="openQuote('${x.id}')">Open</button><button class="rm" style="float:none" onclick="delQuote('${x.id}')">Delete</button></div>`).join(""):'<div class="line">No saved quotes yet</div>';}
window.shareQuote=()=>{const url=location.origin+location.pathname+"#q="+enc(state()),n=$("c_name").value,title="Forged Graphic Design quote"+(n?" – "+n:"");
 const fb=()=>{const done=()=>alert("Share link copied ✅");if(navigator.clipboard)navigator.clipboard.writeText(url).then(done,()=>prompt("Copy this link:",url));else prompt("Copy this link:",url);};
 if(navigator.share)navigator.share({title,text:title+" ("+m(q().total)+" CAD)",url}).catch(e=>{if(e&&e.name!=="AbortError")fb();});else fb();};
let curNo=null;
function nextNo(){const d=new Date(),p="Q-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-";
 const used=getS().map(x=>x.no||"").filter(n=>n.startsWith(p)).map(n=>+n.slice(p.length)||0);return p+String(Math.max(0,...used)+1).padStart(2,"0");}
function items(r){const V=[],B=[];r.lines.forEach((x,i)=>{if(!x.L)return;const d=L[i];
 V.push([x.q,`Decal ${i+1} – ${d.w||0}"×${d.h||0}" ${d.vinyl} (${x.L}" billed)`,x.q?x.vinyl/x.q:0,x.vinyl]);
 if(x.install)B.push([x.q,`Installation (size) – decal ${i+1}`,x.install/x.q,x.install]);
 if(x.labour)B.push([x.q,`Labour ${x.hrs} h – decal ${i+1}`,x.labour/x.q,x.labour]);});
 r.times.forEach(x=>{if(x.cost>0)B.push([x.h,`${x.name} (hours)`,x.rate,x.cost]);});return {V,B};}
window.pdfQuote=()=>{const r=q(),{V,B}=items(r),c=state().c,f=n=>"$"+(+n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
 const sv=getS().find(x=>x.id===curId);if(sv&&!sv.no){sv.no=nextNo();putS(getS().map(x=>x.id===sv.id?sv:x));}
 const no=sv?sv.no:(curNo||(curNo=nextNo())),dt=sv?sv.date:Date.now(),ymd=t=>new Date(t).toLocaleDateString("en-CA");
 const tr=x=>`<tr><td class="q">${+(+x[0]).toFixed(2)}</td><td>${esc(x[1])}</td><td class="r">${f(x[2])}</td><td class="r">${f(x[3])}</td></tr>`;
 const to=[c.n||"—"].concat(c.ct?[c.ct]:[]).map(esc).join("<br>");
 $("pv").innerHTML=`<div class="top"><div class="biz"><img src="logo.png" alt="FORGED" style="height:60px;display:block;margin-bottom:8px"><b>Forged Design graphique</b><br>Kian Drake Pagador<br>Montréal, QC<br>forgedgraphicdesign@gmail.com<br>438-355-8889<br>Business No. / NEQ: 2282690140</div>
 <div class="ttl"><b>QUOTE</b>Quote No.: ${no}<br>Date: ${ymd(dt)}<br>Valid Until: ${ymd(dt+30*864e5)}<br>Page: 1</div></div>
 <div class="to"><div><b>Bill to:</b><br>${to}</div><div><b>Service / Ship to:</b><br>${to}</div></div>
 <table><thead><tr><th class="q">Quantity</th><th>Description</th><th class="r">Unit Price</th><th class="r">Amount</th></tr></thead><tbody>
 <tr class="grp"><td></td><td>VINYL</td><td></td><td></td></tr>${V.map(tr).join("")}
